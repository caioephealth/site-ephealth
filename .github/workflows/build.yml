# Gera o build do site epHealth para o Wix Headless num computador Linux.
# O resultado (out/build.zip: dist/ e .wix/) volta para este ramo; a publicação no Wix é feita à parte.
name: wix-build
on:
  push:
    branches: [wix-build]
    paths-ignore: ['out/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Variáveis do build (o cliente OAuth é público; os outros três o Wix preenche ao publicar)
        run: |
          cat > .env.local <<EOF
          WIX_CLIENT_ID="4c80fbe9-d4b5-4323-83ea-cda22a481319"
          WIX_CLOUD_PROVIDER="KUBERNETES"
          WIX_CLIENT_INSTANCE_ID="set-at-release"
          WIX_CLIENT_PUBLIC_KEY="set-at-release"
          WIX_CLIENT_SECRET="set-at-release"
          EOF
      - run: npx astro build
      - run: mkdir -p out && rm -f out/build.zip && zip -qr out/build.zip dist .wix && ls -l out
      - name: Guarda o build no ramo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f out/build.zip
          git commit -m "build do Wix [skip ci]"
          git push
